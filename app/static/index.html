<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Orientation Correction</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a2332;
      min-height: 100vh;
    }

    .page-wrap {
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem 2.5rem;
    }

    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.4rem; }
    .subtitle { color: #5a6a7e; font-size: 0.95rem; margin-bottom: 2rem; }

    /* ── Upload Card ─────────────────────────────────────────────── */
    .upload-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #dde3ec;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .upload-label span { font-weight: 600; font-size: 0.9rem; color: #344054; display: block; margin-bottom: 0.2rem; }
    .upload-label small { color: #6b7c93; font-size: 0.8rem; }

    .file-row { display: flex; align-items: center; gap: 0.75rem; }

    input[type="file"] { display: none; }

    .btn-choose {
      padding: 0.55rem 1.1rem;
      background: #fff;
      border: 1.5px solid #c4cdd8;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: #344054;
      transition: border-color .2s;
      white-space: nowrap;
    }
    .btn-choose:hover { border-color: #3b82f6; background: #f0f7ff; }

    #fileChosen { color: #5a6a7e; font-size: 0.85rem; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-start {
      padding: 0.65rem 1.6rem;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: background .2s;
      white-space: nowrap;
    }
    .btn-start:hover:not(:disabled) { background: #1447c0; }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-download {
      display: inline-block;
      padding: 0.65rem 1.6rem;
      background: #0d9488;
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s;
    }
    .btn-download:hover { background: #0f766e; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results ─────────────────────────────────────────────────── */
    #results { display: none; }

    .col-headers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 0.75rem;
    }
    .col-header { font-weight: 700; font-size: 1rem; color: #344054; padding: 0 0.25rem; }

    .page-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      align-items: start;
    }

    .page-cell {
      background: #fff;
      border: 1px solid #dde3ec;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      min-height: 180px;
      justify-content: center;
    }

    .page-label {
      font-size: 0.78rem;
      color: #8a97a8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      align-self: flex-start;
    }

    .page-cell img, .page-cell canvas {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      display: block;
    }

    /* ── Terminal ─────────────────────────────────────────────────── */
    .terminal-wrap {
      margin-top: 1rem;
      background: #fff;
      border: 1px solid #dde3ec;
      border-radius: 10px;
      overflow: hidden;
    }
    .terminal-head {
      background: #f0f4f8;
      border-bottom: 1px solid #dde3ec;
      padding: 0.6rem 1.2rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: #5a6a7e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .terminal-body {
      padding: 1rem 1.2rem;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.875rem;
      line-height: 1.8;
    }
    .trow { display: flex; gap: 1rem; }
    .tkey { color: #8a97a8; min-width: 200px; }
    .tval { color: #1a2332; font-weight: 600; }
    .tval.ok  { color: #0a7c42; }
    .tval.err { color: #c0392b; }
  </style>
</head>
<body>
<div class="page-wrap">

  <h1>Коррекция ориентации документов</h1>
  <p class="subtitle">Загрузите изображение или PDF (1–3 страницы). Модель автоматически исправит ориентацию каждой страницы.</p>

  <!-- Upload Card -->
  <div class="upload-card">
    <div class="upload-label">
      <span>Выберите документ / Choose a document</span>
      <small>JPG, PNG, PDF, WEBP, TIFF — до 10 МБ</small>
    </div>
    <div class="file-row">
      <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.tiff,.tif,.bmp,.webp,.pdf">
      <button class="btn-choose" id="chooseBtn">Выбрать файл</button>
      <span id="fileChosen">Файл не выбран</span>
    </div>
    <button class="btn-start" id="startBtn" disabled>
      <span id="startSpinner" class="spinner" style="display:none"></span>
      <span id="startText">Исправить ориентацию</span>
    </button>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="col-headers">
      <div class="col-header">Оригинал</div>
      <div class="col-header">Результат</div>
    </div>
    <div id="pageRows"></div>
    <div style="text-align: center; margin: 1.25rem 0;">
      <a id="downloadBtn" class="btn-download" style="display:none">Скачать исправленный документ</a>
    </div>
    <div class="terminal-wrap">
      <div class="terminal-head">Ответ модели</div>
      <div class="terminal-body" id="termBody"></div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

  const fileInput    = document.getElementById('fileInput');
  const fileChosen   = document.getElementById('fileChosen');
  const chooseBtn    = document.getElementById('chooseBtn');
  const startBtn     = document.getElementById('startBtn');
  const startSpinner = document.getElementById('startSpinner');
  const startText    = document.getElementById('startText');
  const results      = document.getElementById('results');
  const pageRows     = document.getElementById('pageRows');
  const termBody     = document.getElementById('termBody');
  const downloadBtn  = document.getElementById('downloadBtn');

  let selectedFile = null;

  chooseBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    selectedFile = fileInput.files[0] || null;
    fileChosen.textContent = selectedFile ? selectedFile.name : 'Файл не выбран';
    startBtn.disabled = !selectedFile;
    results.style.display = 'none';
    pageRows.innerHTML = '';
    termBody.innerHTML = '';
    if (downloadBtn) downloadBtn.style.display = 'none';
  });

  function setupDownloadButton(blob, filename) {
    if (!downloadBtn) return;
    const url = URL.createObjectURL(blob);
    downloadBtn.href = url;
    downloadBtn.download = filename;
    downloadBtn.style.display = 'inline-block';
  }

  function makePageRow() {
    const row        = document.createElement('div');
    row.className    = 'page-row';
    const origCell   = document.createElement('div');
    origCell.className  = 'page-cell';
    const resultCell = document.createElement('div');
    resultCell.className = 'page-cell';
    row.appendChild(origCell);
    row.appendChild(resultCell);
    pageRows.appendChild(row);
    return { origCell, resultCell };
  }

  function setImage(cell, blob, pageNum) {
    const url = URL.createObjectURL(blob);
    const lbl = document.createElement('span');
    lbl.className = 'page-label';
    lbl.textContent = `Страница ${pageNum}`;
    const img = document.createElement('img');
    img.src = url;
    cell.innerHTML = '';
    cell.appendChild(lbl);
    cell.appendChild(img);
  }

  function setCanvas(cell, canvas, pageNum) {
    const lbl = document.createElement('span');
    lbl.className = 'page-label';
    lbl.textContent = `Страница ${pageNum}`;
    cell.innerHTML = '';
    cell.appendChild(lbl);
    cell.appendChild(canvas);
  }

  function setSpinner(cell, pageNum) {
    const lbl = document.createElement('span');
    lbl.className = 'page-label';
    lbl.textContent = `Страница ${pageNum}`;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin:1.5rem auto;display:flex;flex-direction:column;align-items:center;gap:.5rem';
    wrap.innerHTML = `
      <div style="width:28px;height:28px;border:3px solid rgba(0,0,0,.12);border-top-color:#1a56db;border-radius:50%;animation:spin .7s linear infinite"></div>
      <span style="font-size:.82rem;color:#8a97a8">Обработка...</span>`;
    cell.innerHTML = '';
    cell.appendChild(lbl);
    cell.appendChild(wrap);
  }

  startBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    const isPdf = selectedFile.name.toLowerCase().endsWith('.pdf');

    startBtn.disabled = true;
    startSpinner.style.display = '';
    startText.textContent = 'Обработка...';
    pageRows.innerHTML = '';
    termBody.innerHTML = '';
    results.style.display = 'block';

    const t0 = performance.now();
    const resultCells = [];

    try {
      // ── Render originals ────────────────────────────────────────────
      if (!isPdf) {
        const { origCell, resultCell } = makePageRow();
        setImage(origCell, selectedFile, 1);
        setSpinner(resultCell, 1);
        resultCells.push(resultCell);
      } else {
        const buf    = await selectedFile.arrayBuffer();
        const pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
        const total  = Math.min(pdfDoc.numPages, 10);
        for (let p = 1; p <= total; p++) {
          const page   = await pdfDoc.getPage(p);
          const vp     = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          canvas.width  = vp.width;
          canvas.height = vp.height;
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
          const { origCell, resultCell } = makePageRow();
          setCanvas(origCell, canvas, p);
          setSpinner(resultCell, p);
          resultCells.push(resultCell);
        }
      }

      // ── Send to API ─────────────────────────────────────────────────
      const form = new FormData();
      form.append('file', selectedFile);
      const resp = await fetch('/correct-orientation', { method: 'POST', body: form });
      const elapsed = Math.round(performance.now() - t0);

      if (!resp.ok) {
        let detail = `HTTP ${resp.status}`;
        try { detail = (await resp.json()).detail; } catch {}
        throw new Error(detail);
      }

      const orientation = resp.headers.get('X-Original-Orientation') || '0';
      const rotation    = resp.headers.get('X-Rotation-Applied')     || '0';
      const confidence  = resp.headers.get('X-Confidence')           || '1';
      const pageCount   = resp.headers.get('X-Page-Count')           || '1';
      const requestId   = resp.headers.get('X-Request-Id')           || '-';
      const ct          = resp.headers.get('Content-Type')           || '';

      // ── Display corrected images / PDF pages ───────────────────────
      if (isPdf || ct.includes('pdf')) {
        const buf = await resp.arrayBuffer();
        const pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
        const total = Math.min(pdfDoc.numPages, 10);
        for (let p = 1; p <= total; p++) {
          const page = await pdfDoc.getPage(p);
          const vp = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          canvas.width = vp.width;
          canvas.height = vp.height;
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
          if (resultCells[p - 1]) {
            setCanvas(resultCells[p - 1], canvas, p);
          }
        }
        // Prepare optional download link
        const dlBlob = new Blob([buf], { type: 'application/pdf' });
        setupDownloadButton(dlBlob, 'corrected_' + selectedFile.name);
      } else if (ct.includes('zip')) {
        const zipBlob = await resp.blob();
        const zip     = await JSZip.loadAsync(zipBlob);
        const names   = Object.keys(zip.files).filter(n => n.endsWith('.png')).sort();
        for (let i = 0; i < names.length; i++) {
          const blob = await zip.files[names[i]].async('blob');
          if (resultCells[i]) setImage(resultCells[i], blob, i + 1);
        }
        setupDownloadButton(zipBlob, 'corrected_' + selectedFile.name + '.zip');
      } else {
        const blob = await resp.blob();
        if (resultCells[0]) setImage(resultCells[0], blob, 1);
        setupDownloadButton(blob, 'corrected_' + selectedFile.name);
      }

      // ── Terminal ────────────────────────────────────────────────────
      termBody.innerHTML = `
        <div class="trow"><span class="tkey">Статус</span><span class="tval ok">200 OK — Успешно</span></div>
        <div class="trow"><span class="tkey">Обнаруженная ориентация</span><span class="tval">${orientation}°</span></div>
        <div class="trow"><span class="tkey">Применённый поворот</span><span class="tval">${rotation}° по часовой стрелке</span></div>
        <div class="trow"><span class="tkey">Уверенность модели</span><span class="tval">${(parseFloat(confidence)*100).toFixed(1)}%</span></div>
        <div class="trow"><span class="tkey">Обработано страниц</span><span class="tval">${pageCount}</span></div>
        <div class="trow"><span class="tkey">Время обработки</span><span class="tval">${elapsed} мс</span></div>
        <div class="trow"><span class="tkey">ID запроса</span><span class="tval" style="color:#8a97a8">${requestId}</span></div>
      `;

    } catch (err) {
      console.error('Orientation correction error:', err);
      termBody.innerHTML = `
        <div class="trow"><span class="tkey">Статус</span><span class="tval err">ОШИБКА</span></div>
        <div class="trow"><span class="tkey">Сообщение</span><span class="tval">${err.message}</span></div>
      `;
      resultCells.forEach((c, i) => {
        c.innerHTML = `<span style="color:#c0392b;font-size:.9rem">❌ Ошибка при обработке страницы ${i+1}</span>`;
      });
    } finally {
      startBtn.disabled = false;
      startSpinner.style.display = 'none';
      startText.textContent = 'Исправить ориентацию';
    }
  });
</script>
</body>
</html>
